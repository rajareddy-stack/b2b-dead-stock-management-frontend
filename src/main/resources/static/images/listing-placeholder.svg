<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" fill="none">
  <!-- Warm Ivory Paper Background -->
  <rect width="960" height="600" fill="#FAFAF8"/>
  
  <!-- Subtle Editorial 1px Framing Rules -->
  <rect x="24" y="24" width="912" height="552" fill="none" stroke="#E8E4DF" stroke-width="1"/>
  <rect x="32" y="32" width="896" height="536" fill="none" stroke="#E8E4DF" stroke-width="0.5" stroke-dasharray="4 4"/>
  
  <!-- Stylized Raw Material Steel Ingots & Coils (Fine Line Engraving) -->
  <g transform="translate(480, 260)" stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Stacked Steel Billets / Raw Metal Plates -->
    <path d="M-120 40 L-40 0 L120 0 L40 40 Z" fill="#F5F3F0"/>
    <path d="M-120 40 L-120 60 L40 100 L40 40 Z" fill="#E8E4DF"/>
    <path d="M40 100 L120 60 L120 0 L40 40 Z" fill="#FFFFFF"/>
    
    <!-- Top Layer Billet -->
    <path d="M-80 0 L0 -40 L160 -40 L80 0 Z" fill="#FFFFFF"/>
    <path d="M-80 0 L-80 20 L80 20 L80 0 Z" fill="#F5F3F0"/>
    <path d="M80 20 L160 -20 L160 -40 L80 0 Z" fill="#E8E4DF"/>
    
    <!-- Fine Editorial Engraving Hatch Marks -->
    <line x1="-100" y1="50" x2="-60" y2="30" stroke="#B8860B" stroke-width="0.8"/>
    <line x1="-90" y1="55" x2="-50" y2="35" stroke="#B8860B" stroke-width="0.8"/>
    <line x1="-80" y1="60" x2="-40" y2="40" stroke="#B8860B" stroke-width="0.8"/>
    
    <!-- Gold Accent Line -->
    <line x1="-120" y1="60" x2="40" y2="100" stroke="#B8860B" stroke-width="2"/>
  </g>
  
  <!-- Refined Editorial Typography -->
  <text x="480" y="410" fill="#1A1A1A" font-family="'Playfair Display', Georgia, serif" font-size="22" font-style="italic" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    Raw Material Lot
  </text>
  <text x="480" y="440" fill="#6B6B6B" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="2">
    CERTIFIED INDUSTRIAL SURPLUS · SPECIFICATION ON FILE
  </text>
</svg>
